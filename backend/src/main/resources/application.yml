spring:
  application:
    name: biblioteca

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:samuel123*}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

app:
  jwt:
    secret: ${JWT_SECRET:llave-secreta-de-minimo-32-bytes-develop}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    from: ${MAIL_FROM:biblioteca@ezertech.local}
  openlibrary:
    base-url: ${OPENLIBRARY_BASE_URL:https://openlibrary.org}
    covers-base-url: ${OPENLIBRARY_COVERS_URL:https://covers.openlibrary.org}
    timeout-seconds: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.ezertech.backend: DEBUG