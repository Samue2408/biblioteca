<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Préstamo vencido</title></head>
<body>
<p>Hola <span th:text="${borrowerName}">nombre</span>,</p>
<p>El préstamo de <strong th:text="${bookTitle}">título</strong> venció el
    <span th:text="${dueDate}">fecha</span> y aún no lo has devuelto.</p>
<p>Por favor devuélvelo lo antes posible. Si acumulas 3 devoluciones tardías en un
    periodo de 90 días, tu cuenta se bloqueará temporalmente para nuevos préstamos.</p>
</body>
</html>
